name: Compatibility report
description: macOS version, hardware, or module conflict (no serial / Apple ID)
title: "[Compatibility]: "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        See `docs/COMPATIBILITY.md` and `docs/INTERNAL_TESTING.md`.
        **Do not** include serial numbers, Apple ID, full home paths, or payment details.

  - type: input
    id: module
    attributes:
      label: Module name
      placeholder: Window Corners
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Tweaksmith version / tag
      placeholder: v0.1.0-dev.2
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.x or 27.x (build optional)"
    validations:
      required: true

  - type: dropdown
    id: chip
    attributes:
      label: Chip
      options:
        - Apple Silicon
        - Intel
        - Unknown
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: What happens?
    validations:
      required: true

  - type: checkboxes
    id: restore
    attributes:
      label: Restore
      options:
        - label: Restore Previous / Original / Reset fixed the issue
        - label: Restore did not help
        - label: Did not try restore

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Redact PII. No serial, Apple ID, or private research scoring.
