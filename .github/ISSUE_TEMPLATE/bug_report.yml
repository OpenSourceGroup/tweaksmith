name: Bug report
description: Something broken in Tweaksmith or a module (redact PII)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Include steps to reproduce. If preferences are involved, note whether Restore fixed the issue.
        **Do not** paste serial numbers, Apple ID, secrets, full preference dumps with personal data, or private research scoring.

  - type: input
    id: version
    attributes:
      label: Tweaksmith version / tag
      placeholder: v0.1.0-dev.2
    validations:
      required: true

  - type: dropdown
    id: chip
    attributes:
      label: Mac chip
      options:
        - Apple Silicon
        - Intel
        - Unknown
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.x (Tahoe) / 27.x"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Redact PII. No serial, Apple ID, or payment/card data.

  - type: checkboxes
    id: restore
    attributes:
      label: Recovery
      options:
        - label: Restore Previous / Restore Original / Reset fixed the issue
        - label: Issue persists after restore
        - label: Did not try restore
