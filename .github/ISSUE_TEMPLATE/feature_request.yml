name: Feature request
description: Propose a tweak or improvement (roadmap alignment; no private scoring)
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Read `docs/PRODUCT_PRINCIPLES.md` and `docs/ROADMAP.md` first.
        We do not ship telemetry, accounts, paid unlocks, or SIP/Gatekeeper bypasses.
        **Do not** include serial numbers, Apple ID, or private research scoring.

  - type: textarea
    id: problem
    attributes:
      label: Problem / user story
      placeholder: As a Mac user, I want…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true

  - type: textarea
    id: reversibility
    attributes:
      label: Reversibility (Settings Engine restore paths)
      description: How do BACKUP / APPLY / VERIFY / RESTORE / RESET apply?
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risk estimate (your best guess)
      options:
        - LOW
        - MEDIUM
        - HIGH
        - UNVERIFIED
    validations:
      required: true

  - type: checkboxes
    id: principles
    attributes:
      label: Principles check
      options:
        - label: No telemetry, ads, or accounts
          required: true
        - label: No SIP/Gatekeeper disable or kexts
          required: true
        - label: Voluntary support only — never pay-to-unlock
          required: true

  - type: textarea
    id: context
    attributes:
      label: Extra context (optional)
      description: Public Discussion links or related issues only — no private scoring sheets
