name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver pre-release (e.g. 0.1.0-rc.1)
        required: true
        type: string
  push:
    tags:
      - 'v*-rc*'
      - 'v*-*rc*'

permissions:
  contents: write

jobs:
  release-candidate:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap and gate reminder
        run: |
          chmod +x scripts/bootstrap-check.sh scripts/release-gate.sh
          ./scripts/bootstrap-check.sh
          ./scripts/release-gate.sh
          echo "Complete docs/RELEASE_GATE.md before promoting to production."

      - name: Build (placeholder)
        run: |
          mkdir -p dist
          echo "Tweaksmith RC ${{ steps.ver.outputs.version }}" > dist/README.txt
          echo "Replace with xcodebuild archive when app target exists."

      - name: Sign and notarize if secrets present
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "${APPLE_ID:-}" || -z "${APPLE_CERTIFICATE_BASE64:-}" ]]; then
            echo "Signing secrets not configured — skipping sign/notarize (dev/RC artifact only)."
            exit 0
          fi
          echo "Signing/notarization steps go here — never print certificate or password."
          # codesign + notarytool + stapler

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 * > SHA256SUMS.txt 2>/dev/null || true
          cat SHA256SUMS.txt || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tweaksmith-rc-${{ steps.ver.outputs.version }}
          path: dist/

      - name: Create GitHub pre-release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Tweaksmith v${{ steps.ver.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: dist/*
