name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver pre-release (e.g. 0.1.0-rc.1)
        required: true
        type: string
  push:
    tags:
      - 'v*-rc*'
      - 'v*-*rc*'

permissions:
  contents: write

jobs:
  release-candidate:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap, tests, and gate reminder
        env:
          TWEAKSMITH_TEST_ISOLATED_PREFS: "1"
        run: |
          chmod +x scripts/bootstrap-check.sh scripts/release-gate.sh scripts/run-smoke.sh scripts/run-swift-test.sh scripts/package-release.sh
          ./scripts/bootstrap-check.sh
          ./scripts/run-smoke.sh
          if xcodebuild -version >/dev/null 2>&1; then
            ./scripts/run-swift-test.sh
          else
            echo "warning: XCTest skipped — runner has no full Xcode"
          fi
          ./scripts/release-gate.sh
          echo "Complete docs/RELEASE_GATE.md before promoting to production."

      - name: Package release artifact
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          chmod +x scripts/validate-release-artifact.sh
          ./scripts/package-release.sh "${{ steps.ver.outputs.version }}"
          ./scripts/validate-release-artifact.sh
          if grep -q 'gatekeeper_public_ok=no' dist/ARTIFACT_META.txt; then
            echo "RC artifact is UNSIGNED/AD-HOC — draft pre-release only; NOT Stable or Gatekeeper-ready."
          fi
          if grep -q 'gatekeeper_public_ok=yes' dist/ARTIFACT_META.txt; then
            TWEAKSMITH_REQUIRE_GATEKEEPER=yes ./scripts/validate-release-artifact.sh
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tweaksmith-rc-${{ steps.ver.outputs.version }}
          path: dist/

      - name: Create GitHub pre-release (draft if unsigned)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Tweaksmith v${{ steps.ver.outputs.version }}
          prerelease: true
          draft: true
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
            dist/COMPATIBILITY_NOTES.md
            dist/KNOWN_LIMITATIONS.md
            dist/ARTIFACT_META.txt
