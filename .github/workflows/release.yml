name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver release (e.g. 0.1.0)
        required: true
        type: string
      gate_verdict:
        description: READY or READY WITH KNOWN LIMITATIONS (must not be BLOCKED)
        required: true
        type: choice
        options:
          - READY
          - READY WITH KNOWN LIMITATIONS

permissions:
  contents: write

jobs:
  production:
    runs-on: macos-15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block if gate is BLOCKED
        run: |
          if [[ "${{ inputs.gate_verdict }}" == "BLOCKED" ]]; then
            echo "BLOCKED verdict cannot ship."
            exit 1
          fi
          echo "Gate verdict: ${{ inputs.gate_verdict }}"

      - name: Verify CHANGELOG mentions version
        run: |
          grep -q "${{ inputs.version }}" CHANGELOG.md || {
            echo "Add ${{ inputs.version }} section to CHANGELOG.md"
            exit 1
          }

      - name: Swift tests (isolated domains)
        env:
          TWEAKSMITH_TEST_ISOLATED_PREFS: "1"
        run: |
          chmod +x scripts/run-smoke.sh scripts/run-swift-test.sh
          ./scripts/run-smoke.sh
          if xcodebuild -version >/dev/null 2>&1; then
            ./scripts/run-swift-test.sh
          else
            echo "error: Production release requires Xcode for XCTest on macOS runner" >&2
            exit 1
          fi

      - name: Package release artifact (Stable — Gatekeeper required)
        env:
          TWEAKSMITH_REQUIRE_GATEKEEPER: "yes"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          chmod +x scripts/package-release.sh scripts/validate-release-artifact.sh
          ./scripts/package-release.sh "${{ inputs.version }}"
          grep -q 'gatekeeper_public_ok=yes' dist/ARTIFACT_META.txt
          TWEAKSMITH_REQUIRE_GATEKEEPER=yes ./scripts/validate-release-artifact.sh
          if ls dist/*.zip 2>/dev/null | grep -q 'UNSIGNED-NOT-FOR-GATEKEEPER'; then
            echo "error: Stable release cannot ship UNSIGNED zip name" >&2
            exit 1
          fi

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Tweaksmith v${{ inputs.version }}
          prerelease: false
          draft: false
          body: |
            Gate verdict: ${{ inputs.gate_verdict }}

            See attached RELEASE_NOTES.md, COMPATIBILITY_NOTES.md, and CHANGELOG.md.
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
            dist/COMPATIBILITY_NOTES.md
            dist/KNOWN_LIMITATIONS.md
            dist/ARTIFACT_META.txt

      - name: Website reminder
        run: |
          echo "Update kamyab.co.in download links for v${{ inputs.version }} (manual step)."
