name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver release (e.g. 0.1.0)
        required: true
        type: string
      gate_verdict:
        description: READY or READY WITH KNOWN LIMITATIONS (must not be BLOCKED)
        required: true
        type: choice
        options:
          - READY
          - READY WITH KNOWN LIMITATIONS

permissions:
  contents: write

jobs:
  production:
    runs-on: macos-15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block if gate is BLOCKED
        run: |
          if [[ "${{ inputs.gate_verdict }}" == "BLOCKED" ]]; then
            echo "BLOCKED verdict cannot ship."
            exit 1
          fi
          echo "Gate verdict: ${{ inputs.gate_verdict }}"

      - name: Verify CHANGELOG mentions version
        run: |
          grep -q "${{ inputs.version }}" CHANGELOG.md || {
            echo "Add ${{ inputs.version }} section to CHANGELOG.md"
            exit 1
          }

      - name: Package release artifact
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          chmod +x scripts/package-release.sh scripts/run-smoke.sh
          ./scripts/run-smoke.sh
          ./scripts/package-release.sh "${{ inputs.version }}"
          if ! grep -q 'gatekeeper_public_ok=yes' dist/ARTIFACT_META.txt; then
            echo "Signing secrets not configured — aborting official production artifact."
            echo "Use Release Candidate draft for UNSIGNED builds; do not publish Gatekeeper channel."
            exit 1
          fi

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Tweaksmith v${{ inputs.version }}
          prerelease: false
          draft: false
          body: |
            Gate verdict: ${{ inputs.gate_verdict }}

            See attached RELEASE_NOTES.md, COMPATIBILITY_NOTES.md, and CHANGELOG.md.
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
            dist/COMPATIBILITY_NOTES.md
            dist/KNOWN_LIMITATIONS.md
            dist/ARTIFACT_META.txt

      - name: Website reminder
        run: |
          echo "Update kamyab.co.in download links for v${{ inputs.version }} (manual step)."
