name: Research intake

on:
  workflow_dispatch:
    inputs:
      inbox_file:
        description: Path under research/inbox/ (e.g. 2026-01-15-slug.md)
        required: false
        type: string
      create_issue:
        description: Open GitHub issue from template (manual follow-up if false)
        required: false
        type: boolean
        default: false

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Document Grok intake path
        run: |
          echo "== Tweaksmith research intake =="
          echo "Prompt: docs/RESEARCH_AGENT.md"
          echo "Drop reports: research/inbox/"
          echo "Validate → research/reports/ or research/approved/"
          echo "Then: GitHub issue template 'Research candidate' → human labels now/next/later"
          echo ""
          echo "Research input is UNTRUSTED until human validates sources."
          if [[ -n "${{ inputs.inbox_file }}" ]]; then
            TARGET="research/inbox/${{ inputs.inbox_file }}"
            if [[ -f "$TARGET" ]]; then
              echo "Found: $TARGET"
              head -n 40 "$TARGET" || true
            else
              echo "File not found: $TARGET"
              exit 1
            fi
          else
            echo "No inbox_file input; workflow documents process only."
            ls -la research/inbox/ || true
          fi

      # Optional future: Grok API secret GROK_API_KEY — never log response bodies containing secrets
      - name: Optional automation placeholder
        if: false
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: echo "Wire API when approved; keep reports in research/inbox/"

      - name: Issue creation note
        if: inputs.create_issue == true
        run: |
          echo "Create issue manually with .github/ISSUE_TEMPLATE/research_candidate.yml"
          echo "or use: gh issue create --template research_candidate.yml"
