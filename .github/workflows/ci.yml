name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    env:
      # Tests MUST use isolated preference domains — never mutate runner global prefs
      TWEAKSMITH_TEST_ISOLATED_PREFS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap check
        run: |
          chmod +x scripts/bootstrap-check.sh scripts/release-gate.sh
          ./scripts/bootstrap-check.sh

      - name: Swift Package tests (XCTest when Xcode present)
        id: swift_test
        continue-on-error: true
        run: |
          if xcodebuild -version >/dev/null 2>&1; then
            swift test
          else
            echo "No full Xcode — skipping XCTest"
            exit 1
          fi

      - name: Core smoke tests (isolated domains)
        run: |
          chmod +x scripts/run-smoke.sh
          ./scripts/run-smoke.sh

      - name: Static hygiene
        run: |
          ! rg -n "kamyab\\.in[^.]|rzp_live_|APPLE_ID_PASSWORD|GROK_API_KEY" --glob '!docs/**' --glob '!.github/**' . || true
          ! test -d research
          ! test -f docs/RESEARCH_AGENT.md
          ! test -f docs/CURSOR_ENGINEERING_AGENT.md
          ! test -f .github/workflows/research-intake.yml
          echo "Hygiene scan complete."
